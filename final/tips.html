<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Plate - Storage Tips</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <span class="logo">Save the Plate</span>
    <a href="index.html">Home</a>
    <a href="recipes.html">Leftover Recipes</a>
    <a href="tips.html" class="active">Storage Tips</a>
    <a href="tracker.html">Expiry Tracker</a>
    <a href="share.html">Food Sharing</a>
</nav>

<main>
    <h1>Storage Tips</h1>
    <p>Storing food the right way makes it last longer. Search or filter below.</p>

    <input type="text" id="search" placeholder="Search food, e.g. bread" oninput="showTips()">
    <select id="place" onchange="showTips()">
        <option value="all">All places</option>
        <option value="Fridge">Fridge</option>
        <option value="Freezer">Freezer</option>
        <option value="Room temp">Room temp</option>
    </select>

    <div class="grid" id="tips"></div>
</main>

<footer>Save the Plate · Web Design Final Project · 張守忠 1133584</footer>

<script>
    const tips = [
        { food: "Bread", place: "Room temp", days: "3–4 days", tip: "Freeze slices you won't eat soon. Toast them straight from the freezer." },
        { food: "Rice (cooked)", place: "Fridge", days: "3–4 days", tip: "Cool quickly and keep in a closed box. Great for fried rice." },
        { food: "Milk", place: "Fridge", days: "5–7 days after opening", tip: "Keep it at the back of the fridge, not in the door." },
        { food: "Eggs", place: "Fridge", days: "3–5 weeks", tip: "Keep in the box. Float test: if it floats, throw it away." },
        { food: "Banana", place: "Room temp", days: "3–5 days", tip: "Brown bananas are perfect for pancakes or smoothies." },
        { food: "Tomato", place: "Room temp", days: "3–5 days", tip: "Move to the fridge only when fully ripe." },
        { food: "Potato", place: "Room temp", days: "2–4 weeks", tip: "Keep in a dark, cool place, away from onions." },
        { food: "Onion", place: "Room temp", days: "1–2 months", tip: "Keep dry with air around them. Cut onion goes in the fridge." },
        { food: "Leafy vegetables", place: "Fridge", days: "3–7 days", tip: "Wrap in a paper towel to soak up extra water." },
        { food: "Chicken (raw)", place: "Fridge", days: "1–2 days", tip: "Freeze if you won't cook it within 2 days." },
        { food: "Chicken (raw)", place: "Freezer", days: "up to 9 months", tip: "Thaw in the fridge, not on the table." },
        { food: "Leftover meals", place: "Freezer", days: "2–3 months", tip: "Write the date on the box before freezing." },
        { food: "Cheese", place: "Fridge", days: "3–4 weeks", tip: "Wrap in paper, then a bag, so it can breathe." },
        { food: "Apples", place: "Fridge", days: "4–6 weeks", tip: "Keep away from other fruit. Apples make them ripen faster." }
    ];

    function showTips() {
        const text = document.getElementById("search").value.toLowerCase();
        const place = document.getElementById("place").value;
        const box = document.getElementById("tips");
        box.innerHTML = "";

        const list = tips.filter(function (t) {
            const nameOk = t.food.toLowerCase().includes(text);
            const placeOk = place === "all" || t.place === place;
            return nameOk && placeOk;
        });

        if (list.length === 0) {
            box.innerHTML = "<p>No tips found.</p>";
            return;
        }

        list.forEach(function (t) {
            box.innerHTML +=
                '<div class="card">' +
                '<h3>' + t.food + '</h3>' +
                '<p><span class="sdg">' + t.place + '</span> ' + t.days + '</p>' +
                '<p>' + t.tip + '</p>' +
                '</div>';
        });
    }

    showTips();
</script>

</body>
</html>
