<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Plate - Leftover Recipes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <span class="logo">Save the Plate</span>
    <a href="index.html">Home</a>
    <a href="recipes.html" class="active">Leftover Recipes</a>
    <a href="tips.html">Storage Tips</a>
    <a href="tracker.html">Expiry Tracker</a>
    <a href="share.html">Food Sharing</a>
</nav>

<main>
    <h1>Leftover Recipes</h1>
    <p>Tick the ingredients you have left, then press <b>Find recipes</b>.</p>

    <div class="ingredients" id="ingredients"></div>
    <button class="btn" onclick="findRecipes()">Find recipes</button>
    <button class="btn" onclick="clearAll()">Clear</button>

    <p id="message"></p>
    <div class="grid" id="results"></div>
</main>

<footer>Save the Plate · Web Design Final Project · 張守忠 1133584</footer>

<script>
    // All ingredients a user can choose
    const ingredients = ["rice", "egg", "bread", "tomato", "potato", "onion",
                         "noodles", "milk", "banana", "cheese", "cabbage", "chicken"];

    // Recipe list: name, ingredients needed, short steps
    const recipes = [
        { name: "Egg Fried Rice", needs: ["rice", "egg", "onion"],
          steps: "Fry onion, add cold rice, push aside, scramble egg, mix with soy sauce." },
        { name: "Tomato Egg Stir-fry", needs: ["tomato", "egg"],
          steps: "Scramble eggs, cook tomato until soft, mix together with a little sugar and salt." },
        { name: "French Toast", needs: ["bread", "egg", "milk"],
          steps: "Mix egg and milk, dip old bread, fry both sides until golden." },
        { name: "Banana Pancakes", needs: ["banana", "egg"],
          steps: "Mash a soft banana, mix with egg, fry small pancakes." },
        { name: "Cheesy Potato Bake", needs: ["potato", "cheese", "milk"],
          steps: "Slice potato, pour milk on top, add cheese, bake 30 minutes." },
        { name: "Cabbage Noodle Soup", needs: ["noodles", "cabbage", "onion"],
          steps: "Boil water, add onion and cabbage, cook noodles in the soup." },
        { name: "Chicken Rice Porridge", needs: ["rice", "chicken", "onion"],
          steps: "Boil leftover rice with lots of water, add chicken pieces and onion." },
        { name: "Bread Pudding", needs: ["bread", "milk", "banana"],
          steps: "Tear stale bread, mix with milk and banana, bake 25 minutes." },
        { name: "Potato Pancakes", needs: ["potato", "egg", "onion"],
          steps: "Grate potato and onion, mix with egg, fry flat pancakes." },
        { name: "Chicken Noodle Stir-fry", needs: ["noodles", "chicken", "cabbage"],
          steps: "Fry chicken, add cabbage, then noodles and sauce." }
    ];

    // Make a checkbox for every ingredient
    const box = document.getElementById("ingredients");
    ingredients.forEach(function (item) {
        box.innerHTML += '<label><input type="checkbox" value="' + item + '">' + item + '</label>';
    });

    function findRecipes() {
        // Get ticked ingredients
        const checked = [];
        document.querySelectorAll("#ingredients input:checked").forEach(function (c) {
            checked.push(c.value);
        });

        const results = document.getElementById("results");
        const message = document.getElementById("message");
        results.innerHTML = "";

        if (checked.length === 0) {
            message.textContent = "Please tick at least one ingredient.";
            return;
        }

        // Count how many needed ingredients the user has
        const found = recipes.map(function (r) {
            const have = r.needs.filter(function (n) { return checked.includes(n); });
            const missing = r.needs.filter(function (n) { return !checked.includes(n); });
            return { recipe: r, have: have.length, missing: missing };
        }).filter(function (x) { return x.have > 0; });

        // Best matches first
        found.sort(function (a, b) { return a.missing.length - b.missing.length; });

        if (found.length === 0) {
            message.textContent = "No recipes found. Try other ingredients.";
            return;
        }
        message.textContent = found.length + " recipe(s) found:";

        found.forEach(function (x) {
            let status = x.missing.length === 0
                ? '<p class="match">You have everything!</p>'
                : '<p class="missing">Missing: ' + x.missing.join(", ") + '</p>';
            results.innerHTML +=
                '<div class="card">' +
                '<h3>' + x.recipe.name + '</h3>' +
                '<p>Needs: ' + x.recipe.needs.join(", ") + '</p>' +
                status +
                '<p>' + x.recipe.steps + '</p>' +
                '</div>';
        });
    }

    function clearAll() {
        document.querySelectorAll("#ingredients input").forEach(function (c) { c.checked = false; });
        document.getElementById("results").innerHTML = "";
        document.getElementById("message").textContent = "";
    }
</script>

</body>
</html>
