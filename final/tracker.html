<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Plate - Expiry Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <span class="logo">Save the Plate</span>
    <a href="index.html">Home</a>
    <a href="recipes.html">Leftover Recipes</a>
    <a href="tips.html">Storage Tips</a>
    <a href="tracker.html" class="active">Expiry Tracker</a>
    <a href="share.html">Food Sharing</a>
</nav>

<main>
    <h1>Expiry Tracker</h1>
    <p>Add your food and its expiry date. Green = OK, orange = eat soon, red = expired.</p>

    <div class="form-box">
        <input type="text" id="food" placeholder="Food name">
        <input type="date" id="date">
        <button class="btn" onclick="addFood()">Add</button>
        <p id="error" class="missing"></p>
    </div>

    <div id="list"></div>
</main>

<footer>Save the Plate · Web Design Final Project · 張守忠 1133584</footer>

<script>
    // Load saved food from the browser
    let foods = [];
    try {
        foods = JSON.parse(localStorage.getItem("foods")) || [];
    } catch (e) {
        foods = [];
    }

    function save() {
        try { localStorage.setItem("foods", JSON.stringify(foods)); } catch (e) {}
    }

    function daysLeft(dateText) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const end = new Date(dateText + "T00:00:00");
        return Math.round((end - today) / (1000 * 60 * 60 * 24));
    }

    function addFood() {
        const name = document.getElementById("food").value.trim();
        const date = document.getElementById("date").value;
        const error = document.getElementById("error");

        if (name === "" || date === "") {
            error.textContent = "Please enter a food name and a date.";
            return;
        }
        error.textContent = "";

        foods.push({ name: name, date: date });
        save();
        document.getElementById("food").value = "";
        document.getElementById("date").value = "";
        showList();
    }

    function removeFood(i) {
        foods.splice(i, 1);
        save();
        showList();
    }

    function showList() {
        const list = document.getElementById("list");
        list.innerHTML = "";

        if (foods.length === 0) {
            list.innerHTML = "<p>No food added yet.</p>";
            return;
        }

        // Soonest expiry first
        foods.sort(function (a, b) { return a.date.localeCompare(b.date); });

        foods.forEach(function (f, i) {
            const d = daysLeft(f.date);
            let cls = "", text = "";
            if (d < 0)       { cls = "expired"; text = "Expired " + (-d) + " day(s) ago"; }
            else if (d === 0){ cls = "soon";    text = "Expires today!"; }
            else if (d <= 2) { cls = "soon";    text = d + " day(s) left - eat soon"; }
            else             { cls = "";        text = d + " days left"; }

            list.innerHTML +=
                '<div class="food-item ' + cls + '">' +
                '<span><b>' + f.name + '</b> · ' + text + '</span>' +
                '<button class="delete" onclick="removeFood(' + i + ')">✕</button>' +
                '</div>';
        });
    }

    showList();
</script>

</body>
</html>
